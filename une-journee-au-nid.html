<style>
:root { --rouge:#c8321e; --ambre:#e8a05c; --nuit:#120a08; --creme:#f2e4d4; }
* { margin:0; padding:0; box-sizing:border-box; }
body { background:var(--nuit); color:var(--creme);
  font-family:Georgia,'Times New Roman',serif; }
header { text-align:center; padding:64px 20px 30px; }
h1 { font-size:clamp(28px,5vw,52px); font-weight:normal; letter-spacing:.04em; }
h1 .etoile { color:var(--rouge); }
.sous { margin-top:14px; font-style:italic; opacity:.75; font-size:clamp(14px,2vw,18px); }
.compte { margin-top:10px; font-size:13px; letter-spacing:.2em; text-transform:uppercase; color:var(--ambre); }
.fil { max-width:1200px; margin:0 auto; padding:20px 16px 80px; position:relative; }
.fil::before { content:''; position:absolute; left:50%; top:0; bottom:0; width:1px;
  background:linear-gradient(180deg,transparent,var(--rouge) 8%,var(--rouge) 92%,transparent); opacity:.35; }
.frag { width:calc(50% - 42px); margin:26px 0; cursor:pointer; position:relative;
  background:#1c110d; border:1px solid #33201a; border-radius:6px; overflow:hidden;
  transition:transform .25s ease, border-color .25s ease; }
.frag:hover { transform:translateY(-3px); border-color:var(--rouge); }
.frag:nth-child(odd) { margin-left:0; }
.frag:nth-child(even) { margin-left:calc(50% + 42px); }
.frag img { width:100%; display:block; aspect-ratio:1/1; object-fit:cover; }
.heure { position:absolute; top:10px; left:10px; z-index:2; background:rgba(18,10,8,.82);
  color:var(--ambre); font-size:13px; letter-spacing:.12em; padding:4px 10px; border-radius:3px;
  border:1px solid rgba(200,50,30,.4); }
figcaption { padding:12px 14px 14px; font-style:italic; font-size:15px; line-height:1.4; opacity:.9; }
@media (max-width:760px) {
  .fil::before { left:12px; }
  .frag, .frag:nth-child(even) { width:calc(100% - 34px); margin-left:34px; }
}
footer { text-align:center; padding:30px 20px 70px; font-style:italic; opacity:.65; font-size:15px; line-height:1.8; }
footer a { color:var(--ambre); text-decoration:none; }
#lightbox { position:fixed; inset:0; background:rgba(10,5,4,.94); display:none;
  align-items:center; justify-content:center; z-index:10; cursor:zoom-out; flex-direction:column; padding:20px; }
#lightbox.on { display:flex; }
#lightbox img { max-width:min(92vw,900px); max-height:82vh; border-radius:4px; }
#lightbox p { margin-top:14px; font-style:italic; color:var(--creme); font-size:16px; text-align:center; }
</style>

<div id="lightbox"><img alt=""><p></p></div>
<script>
const lb = document.getElementById('lightbox');
const lbImg = lb.querySelector('img');
const lbTxt = lb.querySelector('p');
document.querySelectorAll('.frag').forEach(f => {
  f.addEventListener('click', () => {
    lbImg.src = f.dataset.full;
    lbTxt.textContent = f.querySelector('.heure').textContent + ' — ' + f.querySelector('figcaption').textContent;
    lb.classList.add('on');
  });
});
lb.addEventListener('click', () => lb.classList.remove('on'));
document.addEventListener('keydown', e => { if (e.key === 'Escape') lb.classList.remove('on'); });
</script>
